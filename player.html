<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#202027" />
  <title>Saidao 直播</title>
  <link rel="stylesheet" href="assets/css/player.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
  <script defer src="assets/js/player.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 19.4 9M4.6 15A8 8 0 0 0 17.9 17.9"/></symbol>
    <symbol id="icon-volume-on" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="icon-volume-off" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Z"/><path d="m16 9 6 6m0-6-6 6"/></symbol>
    <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="icon-exit-fullscreen" viewBox="0 0 24 24"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="icon-danmaku" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="3"/><path d="M7 9h5m3 0h2M7 14h2m3 0h5"/></symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5A8.5 8.5 0 0 1 10.5 3h2a8.5 8.5 0 0 1 8.5 8.5Z"/><path d="M7 10h9M7 14h5"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="icon-broadcast" viewBox="0 0 24 24"><path d="M8 8a6 6 0 0 0 0 8m8-8a6 6 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/><circle cx="12" cy="12" r="2"/></symbol>
  </svg>

  <main class="layout" id="playerLayout">
    <section class="player-area" aria-label="直播播放器">
      <div class="player-shell">
        <video id="video" class="video" playsinline webkit-playsinline muted autoplay></video>
        <div class="danmaku-layer" id="danmakuLayer" aria-hidden="true"></div>
        <header class="stage-header">
          <div class="streamer">
            <div class="streamer-avatar">
              <span id="streamerInitial" aria-hidden="true">S</span>
              <img id="streamerAvatar" alt="主播头像" hidden />
            </div>
            <div class="streamer-details">
              <h1 id="streamerName">正在进入直播间</h1>
              <div class="streamer-meta">
                <span class="live-badge" id="liveBadge" data-state="loading">
                  <span class="live-signal" aria-hidden="true"><i></i><i></i><i></i></span>
                  <span id="liveState">连接中</span>
                </span>
                <span class="streamer-room" id="streamerRoom">Saidao 直播</span>
              </div>
            </div>
          </div>
          <button class="origin-btn" id="originBtn" type="button" title="打开主播源站">
            <span>去源站</span><svg class="icon" aria-hidden="true"><use href="#icon-external" /></svg>
          </button>
        </header>

        <div class="status-overlay" id="statusOverlay" role="status" aria-live="polite">
          <div class="status-card">
            <div class="status-symbol" aria-hidden="true"><svg class="icon"><use href="#icon-broadcast" /></svg></div>
            <div class="status-title" id="statusTitle">正在连接直播</div>
            <div class="status-sub" id="statusSub">精彩即将开始，请稍候</div>
          </div>
        </div>
        <button class="tap-play" id="tapPlayBtn" type="button" aria-label="点击播放直播">
          <span class="tap-play-symbol"><svg class="icon" aria-hidden="true"><use href="#icon-play" /></svg></span>
          <span>点击播放</span>
        </button>
        <div class="player-controls" role="group" aria-label="播放控制">
          <div class="controls-start">
            <button class="control-btn" id="refreshBtn" type="button" title="刷新直播" aria-label="刷新直播">
              <svg class="icon" aria-hidden="true"><use href="#icon-refresh" /></svg>
            </button>
            <div class="volume-pop">
              <button class="control-btn" id="volumeBtn" type="button" title="开启声音" aria-label="开启声音">
                <svg class="icon" aria-hidden="true"><use href="#icon-volume-off" /></svg>
              </button>
              <div class="volume-popover" id="volumePopover">
                <label class="volume-caption" for="volumeSlider">音量</label>
                <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量" />
              </div>
            </div>
            <span class="control-divider" aria-hidden="true"></span>
            <span class="stream-status" id="streamSub">正在连接直播</span>
          </div>
          <div class="controls-end">
            <button class="control-text danmaku-toggle is-on" id="danmakuToggleBtn" type="button" aria-pressed="true" title="切换弹幕">
              <svg class="icon" aria-hidden="true"><use href="#icon-danmaku" /></svg><span id="danmakuLabel">弹幕开</span>
            </button>
            <button class="control-text fullscreen-control" id="fullscreenBtn" type="button" title="切换全屏">
              <svg class="icon" aria-hidden="true"><use href="#icon-fullscreen" /></svg><span id="fullscreenLabel">全屏</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <aside class="comment-panel" aria-label="直播评论">
      <div class="panel-header">
        <div class="panel-heading"><svg class="icon" aria-hidden="true"><use href="#icon-chat" /></svg><h2>直播评论</h2></div>
        <span class="panel-sub" id="commentSub">连接中...</span>
      </div>
      <div class="comment-tab"><span>全部评论</span></div>
      <div class="comment-body">
        <div class="comment-list" id="commentList" role="log" aria-label="实时评论" aria-live="off"></div>
        <div class="comment-empty" id="commentEmpty">
          <svg class="icon" aria-hidden="true"><use href="#icon-chat" /></svg>
          <p>等待第一条评论</p><span>直播间的热闹，即将在这里出现</span>
        </div>
        <button class="scroll-bottom-btn" id="scrollBottomBtn" type="button" aria-hidden="true">
          <span>回到最新评论</span><svg class="icon" aria-hidden="true"><use href="#icon-down" /></svg>
        </button>
      </div>
      <div class="panel-footer"><span class="footer-live"><span aria-hidden="true"></span>此刻，一起看直播</span><span class="shortcut-hint"><kbd>P</kbd> 声音</span></div>
    </aside>
  </main>
</body>
</html>
